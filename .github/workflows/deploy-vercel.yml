name: Deploy to Vercel

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy-api:
    name: Deploy API to Vercel
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install Vercel CLI
      run: npm install -g vercel@latest
      
    - name: Install API dependencies
      run: |
        cd apps/api
        pip install -r requirements-vercel.txt
        
    - name: Deploy API to Vercel
      run: |
        cd apps/api
        vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes
      env:
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
        
    - name: Get API URL
      id: api-url
      run: |
        cd apps/api
        API_URL=$(vercel ls --token ${{ secrets.VERCEL_TOKEN }} | grep -o 'https://[^[:space:]]*' | head -1)
        echo "api_url=$API_URL" >> $GITHUB_OUTPUT
        echo "API deployed at: $API_URL"
        
    - name: Set API URL for web deployment
      run: |
        echo "API_URL=${{ steps.api-url.outputs.api_url }}" >> $GITHUB_ENV

  deploy-web:
    name: Deploy Web App to Vercel
    runs-on: ubuntu-latest
    needs: deploy-api
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        cd apps/web
        npm ci
        
    - name: Install Vercel CLI
      run: npm install -g vercel@latest
      
    - name: Build web app
      run: |
        cd apps/web
        npm run build
        
    - name: Deploy Web App to Vercel
      run: |
        cd apps/web
        vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes
      env:
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
        NEXT_PUBLIC_API_BASE: ${{ needs.deploy-api.outputs.api_url }}
        
    - name: Get Web URL
      id: web-url
      run: |
        cd apps/web
        WEB_URL=$(vercel ls --token ${{ secrets.VERCEL_TOKEN }} | grep -o 'https://[^[:space:]]*' | head -1)
        echo "web_url=$WEB_URL" >> $GITHUB_OUTPUT
        echo "Web app deployed at: $WEB_URL"

  deploy-monorepo:
    name: Deploy Monorepo to Vercel
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        npm ci
        cd apps/web && npm ci
        cd ../api && pip install -r requirements-vercel.txt
        
    - name: Install Vercel CLI
      run: npm install -g vercel@latest
      
    - name: Build projects
      run: |
        cd apps/web
        npm run build
        
    - name: Deploy Monorepo to Vercel
      run: |
        vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes
      env:
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_MONOREPO_PROJECT_ID }}
        
    - name: Get Deployment URL
      id: deployment-url
      run: |
        DEPLOYMENT_URL=$(vercel ls --token ${{ secrets.VERCEL_TOKEN }} | grep -o 'https://[^[:space:]]*' | head -1)
        echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        echo "Monorepo deployed at: $DEPLOYMENT_URL"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web, deploy-monorepo]
    if: always()
    
    steps:
    - name: Notify Success
      if: needs.deploy-api.result == 'success' || needs.deploy-web.result == 'success' || needs.deploy-monorepo.result == 'success'
      run: |
        echo "✅ Deployment successful!"
        echo "Check your Vercel dashboard for deployment URLs"
        
    - name: Notify Failure
      if: needs.deploy-api.result == 'failure' || needs.deploy-web.result == 'failure' || needs.deploy-monorepo.result == 'failure'
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs for more details"